name: CI Tests (uv + Container)

# Pull requests and master only (as web.yaml): a push to a PR branch is already covered by its pull request.
on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

# the jobs only read the repository (artifacts use their own token)
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest

    container:
      image: python:3.13.7-slim

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install OS dependencies
      run: apt-get update && apt-get install -y chromium-headless-shell zip

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        python-version: "3.13.7"

    - name: Install dependencies
      run: uv sync --frozen --no-group device

    - name: Lint (syntax errors and undefined names)
      run: uv run ruff check

    - name: Type check (mypy)
      run: uv run mypy

    - name: Run unittests with coverage
      run: uv run coverage run -m unittest discover .

    - name: Coverage summary
      run: |
        uv run coverage report > coverage.txt
        { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Zip test outputs
      # -r for recursive, -q for quiet (hides file list in logs)
      run: zip -r test-output.zip ./.test-output

    - name: Upload Test Output
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-output-archive
        path: test-output.zip
        retention-days: 10
