name: CI Tests (uv + Container)

on: [push, pull_request]

jobs:
  unittest:
    runs-on: ubuntu-latest

    container:
      image: python:3.13.7-slim

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install OS dependencies
      run: apt-get update && apt-get install -y chromium-headless-shell unzip zip

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.13.7"

    - name: Install dependencies
      run: uv sync --frozen --no-group device

    - name: Lint (syntax errors and undefined names)
      run: uv run ruff check

    - name: Type check (mypy)
      run: uv run mypy

    - name: Restore test .storage files
      # use the prepare-test-data.ps1 script for the secret string; decode and unzip it here.
      # The secret is passed through the environment, and an empty secret or a bad archive fails the job.
      env:
        TEST_STORAGE_B64: ${{ secrets.TEST_STORAGE_B64 }}
      run: |
        if [ -z "$TEST_STORAGE_B64" ]; then
          echo "TEST_STORAGE_B64 is empty: the test storage cannot be restored" >&2
          exit 1
        fi
        printf '%s' "$TEST_STORAGE_B64" | base64 --decode > storage.zip
        set +e
        unzip -q -o storage.zip -d ./python/tests/.storage
        rc=$?
        set -e
        # unzip exits 1 for warnings (the archive is made on Windows, with backslash separators); 2 and up are real failures.
        if [ "$rc" -gt 1 ]; then
          echo "unzip failed with exit code $rc" >&2
          exit 1
        fi

    - name: Run unittests with coverage
      run: uv run coverage run -m unittest discover .

    - name: Coverage summary
      run: |
        uv run coverage report > coverage.txt
        { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Zip test outputs
      # -r for recursive, -q for quiet (hides file list in logs)
      run: zip -r test-output.zip ./.test-output

    - name: Upload Test Output
      uses: actions/upload-artifact@v6
      with:
        name: test-output-archive
        path: test-output.zip
        retention-days: 10
