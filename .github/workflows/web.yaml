name: Web App (build, unit tests, browser tests)

# Pull requests and master only: a push to a PR branch is already covered by its pull request.
on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

# the jobs only read the repository (artifacts use their own token)
permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check and build
      run: npm run build

    - name: Unit tests (Vitest)
      run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        python-version: "3.13"

    - name: Install Python dependencies
      run: uv sync --frozen --no-group device

    - name: Install web app dependencies
      run: npm ci
      working-directory: app

    - name: Install the browser
      run: npx playwright install --with-deps chromium
      working-directory: app

    # Builds the app, then starts two real servers on a storage built from synthetic fixtures (no secrets needed).
    - name: Browser tests (Playwright)
      run: npm run e2e
      working-directory: app

    - name: Upload the test report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: |
          app/playwright-report
          app/test-results
        retention-days: 10
