version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # PrimeVue 5 is a paid product: stay on 4.x (and the Prime packages that go with it)
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primevue/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primeuix/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeicons"
        update-types: ["version-update:semver-major"]
      # vue-tsc uses the TypeScript compiler API, which TypeScript 7 does not provide
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # the base images and the pinned uv image in the Dockerfile (#456): a pin by digest gets its update proposed here
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Python stays on 3.13 (the project's version, CI's python:3.13.7-slim): only patch releases of the image
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node stays on its LTS line (24): an odd major is not an LTS release, and the next LTS is a decision of its own
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
