[project]
name = "eink-billboard"
version = "0.1.0"
description = "e-Ink Billboard"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "feedparser==6.0.14",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "icalendar==6.3.1",
    "jinja2>=3.1",
    "numpy==2.5.3",
    "openai==1.109.1",
    "pathvalidate==3.3.1",
    "pillow>=12.3.0",
    "psutil==7.2.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "recurring-ical-events==3.8.2",
    "tzdata>=2025.2",
    "uvicorn>=0.32",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.0",
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]
device = [
    "cysystemd==2.0.5 ; sys_platform == 'linux'",
    "inky==2.5.0 ; sys_platform == 'linux'",
]

[tool.coverage.run]
omit = [
    "*.html",
    "*.css",
    "*/tests/*",
]

[tool.coverage.report]
omit = [
    "*.html",
    "*.css",
    "*/tests/*",
]

[tool.mypy]
# Type checks cover the Python sources and tests; third-party packages without type stubs are not checked.
files = ["python"]
ignore_missing_imports = true

[tool.ruff]
# Only the Python sources; the rest of the repo has no Python to lint.
include = ["python/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
# Baseline (#25): syntax errors and undefined names only, both of which fail at run time.
# The unused imports, unused variables, f-strings without placeholders and redefinitions are
# 84 existing findings; tighten the selection as they are cleaned up.
select = ["E9", "F821"]
