[project]
name = "eink-billboard"
version = "0.1.0"
description = "e-Ink Billboard"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.0",
    "feedparser==6.0.14",
    "fastapi>=0.115",
    "holidays==0.106",
    "httpx>=0.28.1",
    "icalendar==7.3.0",
    "jinja2>=3.1",
    "numpy==2.5.4",
    "openai==3.29.0",
    "pathvalidate==3.3.1",
    "pillow>=12.3.0",
    "psutil==7.2.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "recurring-ical-events==3.8.2",
    "tzdata>=2025.2",
    "uvicorn>=0.32",
    "watchdog==6.0.0",
    "websockets==17.2",
]

[dependency-groups]
dev = [
    "coverage>=7.13.0",
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]
device = [
    "inky==2.5.0 ; sys_platform == 'linux'",
    # what the vendored Waveshare drivers import (python/display/waveshare_epd): gpiozero for the pins (its pure Python "native" pin factory on a Pi up to the 4; a Pi 5 needs the
    # `lgpio` backend, which has no wheel for Python 3.13: it is built from its source package (the device image builds the C library it needs, `lg`, and has `swig` and a compiler)), spidev for the bus (inky brings it too)
    "gpiozero==2.0.1.post3 ; sys_platform == 'linux'",
    "lgpio==0.2.2.0 ; sys_platform == 'linux'",
    "spidev==3.8 ; sys_platform == 'linux'",
]

[tool.coverage.run]
omit = [
    "*.html",
    "*.css",
    "*/tests/*",
    "*/waveshare_epd/*",
]

[tool.coverage.report]
omit = [
    "*.html",
    "*.css",
    "*/tests/*",
    "*/waveshare_epd/*",
]

[tool.mypy]
# Type checks cover the Python sources and tests; third-party packages without type stubs are not checked.
files = ["python"]
# Waveshare's own drivers, vendored as they are (python/display/waveshare_epd/VENDORED.md)
exclude = ["python/display/waveshare_epd/"]
ignore_missing_imports = true

[tool.ruff]
# Only the Python sources; the rest of the repo has no Python to lint.
include = ["python/**/*.py", "scripts/**/*.py"]
# Waveshare's own drivers, vendored as they are (python/display/waveshare_epd/VENDORED.md)
extend-exclude = ["python/display/waveshare_epd"]

[tool.ruff.lint]
# Baseline (#25): syntax errors and undefined names only, both of which fail at run time.
# The unused imports, unused variables, f-strings without placeholders and redefinitions are
# 84 existing findings; tighten the selection as they are cleaned up.
select = ["E9", "F821"]
