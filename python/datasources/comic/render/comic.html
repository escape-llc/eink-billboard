{% extends "plugin.html" %}

{% block style %}
	<style>
		/* a strip is printed on white paper whatever the theme's page (AGENTS.md: the Comic keeps its white page), so its text is black on it.
		   The text size is in px, chosen in Python with the theme's scale applied, because Python measured the lines that fit at that size */
		.comic-sheet {
			box-sizing: border-box;
			width: 100%;
			height: 100%;
			background: #fff;
			color: #000;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			font-size: max(var(--min-text), {{ text_px }}px);
			line-height: {{ line_height }};
		}
		.comic-words {
			flex: none;
			text-align: center;
			overflow-wrap: anywhere;
		}
		.comic-strip {
			flex: 1 1 0;
			min-height: 0;
			width: 100%;
			object-fit: contain;
		}
	</style>
{% endblock %}
{% block content %}
<div class="comic-sheet">
	{% if title %}<div class="comic-words">{{ title }}</div>{% endif %}
	<img class="comic-strip" src="{{ strip }}" alt="">
	{% if caption %}<div class="comic-words">{{ caption }}</div>{% endif %}
</div>
{% endblock %}
