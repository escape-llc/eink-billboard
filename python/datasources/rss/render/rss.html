{% extends "plugin.html" %}

{% block style %}
	<style>
		/* every size is in rem: the root's font size is the page's (an em would follow the element it is on) */
		html {
			font-size: calc(min(4.8dvh, 4.8dvw) * {{ font_scale }} * var(--font-scale));
		}
		.story-page {
			box-sizing: border-box;
			height: 100%;
			width: 100%;
			padding: 4dvh 4dvw;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}
		.story-heading {
			font-family: var(--font-heading);
			flex: none;
			margin: 0 0 .4rem 0;
			padding-bottom: .24rem;
			font-size: .8rem;
			font-weight: bold;
			letter-spacing: .12rem;
			text-transform: uppercase;
			border-bottom: .096rem solid currentColor;
		}
		.story-body {
			flex: 1 1 auto;
			min-height: 0;
			display: flex;
			gap: 1.2rem;
			align-items: center;
			overflow: hidden;
		}
		.story-picture {
			flex: none;
			max-width: 42%;
			max-height: 100%;
			object-fit: contain;
		}
		.story-text {
			flex: 1 1 0;
			min-width: 0;
			max-height: 100%;
			overflow: hidden;
		}
		.story-title {
			font-family: var(--font-heading);
			margin: 0;
			font-size: 1.9rem;
			font-weight: bold;
			line-height: 1.1;
		}
		.story-published {
			margin-top: .2625rem;
			font-size: .75rem;
			letter-spacing: .06rem;
			text-transform: uppercase;
		}
		.story-summary {
			margin-top: .7rem;
			line-height: 1.3;
		}
		/* a tall page: the picture goes above the text, across the width, instead of beside it */
		@media (orientation: portrait) {
			.story-body {
				flex-direction: column;
				justify-content: center;
				align-items: stretch;
			}
			.story-picture {
				max-width: 100%;
				max-height: 42%;
				align-self: center;
			}
			.story-text {
				flex: 0 1 auto;
			}
		}
	</style>
{% endblock %}
{% block content %}
<div class="story-page">
	<div class="story-heading text-secondary-1">{{ heading }}</div>
	<div class="story-body">
		{% if story.picture %}<img class="story-picture" src="{{ story.picture }}" alt="">{% endif %}
		<div class="story-text">
			<h1 class="story-title text-primary">{{ story.title }}</h1>
			{% if story.published %}<div class="story-published text-secondary-2">{{ story.published }}</div>{% endif %}
			{% if story.summary %}<div class="story-summary">{{ story.summary }}</div>{% endif %}
		</div>
	</div>
</div>
{% endblock %}
