{% extends "plugin.html" %}

{% block style %}
	<style>
		.progress-container {
		  display: flex;
		  align-items: center; 
		  justify-content: center;
		  font-family: "Jost";
		  height: 100%;
		  width: 100%;
		}

		.progress-wrapper {
		  width: 90%;
		  text-align: center;
		  margin: 0;
		  padding: 0;
		}

		.progress-title {
		  font-size: min(20dvh, 16vw);
		  font-weight: bold;
		  line-height: 1;
		}

		.progress-subtitle {
		  font-size: min(10dvh, 8vw);
		  margin-bottom: 10dvh;
		  line-height: 1;
		}

		.progress-bar {
		  width: 100%;
		  height: 10dvh;
		  background-color: transparent;
		  border-radius: 5px;
		  overflow: hidden;
		  display: flex;
		}

		.progress-fill {
		  height: 100%;
		}

		.progress-remaining {
		  flex: 1;
		}

		.progress-labels {
		  display: flex;
		  justify-content: space-between;
		  font-size: min(5dvh, 4vw);
		  margin-top: 8px;
		}
	</style>
{% endblock %}
{% block content %}
<div class="progress-container">
	<div class="progress-wrapper">
		<div class="progress-title text-primary">{{year}}</div>
		<div class="progress-subtitle text-secondary-1">PROGRESS</div>
		<div class="progress-bar">
			<div class="progress-fill bg-secondary-1-accent" style="width: {{ year_percent }}%"></div>
			<div class="progress-remaining bg-secondary-2-dark"></div>
		</div>
		<div class="progress-labels text-secondary-2">
			<span>{{year_percent}}% DONE</span>
			<span>{{days_left}} DAYS LEFT</span>
		</div>
	</div>
</div>
{% endblock %}
