{% extends "plugin.html" %}

{% block style %}
	<style>
		/* the year as its days (#694, our own design): a column per week, a cell per day. Past days are solid, today a thick ring, the days to
		   come a thin ring in the lighter ink: told apart by shape, so a black-and-white panel shows the three too */
		.year {
		  display: flex;
		  flex-direction: column;
		  align-items: center;
		  justify-content: center;
		  gap: 4dvh;
		  width: 100%;
		  height: 100%;
		}

		.year-number {
		  font-family: var(--font-heading);
		  font-size: max(var(--min-text), min(18dvh, 14vw));
		  font-weight: bold;
		  line-height: 1;
		}

		.days {
		  display: grid;
		  grid-template-rows: repeat(7, 1fr);
		  grid-template-columns: repeat({{ weeks }}, 1fr);
		  grid-auto-flow: column;
		  gap: min(.4vw, .7dvh);
		  width: min(94vw, calc(45dvh * {{ weeks }} / 7));
		}

		.day {
		  aspect-ratio: 1;
		  border: 1px solid currentColor;
		}

		.day.past {
		  background: currentColor;
		}

		.day.now {
		  border-width: max(2px, .5vw);
		}

		.day.blank {
		  border: none;
		}

		.year-labels {
		  display: flex;
		  justify-content: space-between;
		  width: min(94vw, calc(45dvh * {{ weeks }} / 7));
		  font-size: max(var(--min-text), calc(min(6dvh, 4vw) * var(--font-scale)));
		  font-weight: bold;
		}
	</style>
{% endblock %}
{% block content %}
<div class="year">
	<div class="year-number text-primary">{{ year }}</div>
	<div class="days">
		{% for _ in range(lead) %}<i class="day blank"></i>{% endfor %}
		{% for day in range(days) %}<i class="day {{ 'past text-primary' if day < today else ('now text-primary' if day == today else 'text-secondary-2') }}"></i>{% endfor %}
	</div>
	<div class="year-labels">
		<span class="text-primary">{{ year_percent }}% DONE</span>
		<span class="text-secondary-1">{{ days_left }} DAYS LEFT</span>
	</div>
</div>
{% endblock %}
