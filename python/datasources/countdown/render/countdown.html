{% extends "plugin.html" %}

{% block style %}
	<style>
		.countdown {
			flex-grow: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100%;
			width: 100%;
		}
		.countdown-wrapper {
			width: 90%;
			text-align: center;
			margin: 0;
			padding: 0;
		}
		.title {
			font-family: var(--font-heading);
			font-size: max(var(--min-text), calc(min(11dvw, 11dvh) * var(--font-scale)));
			font-weight: bold;
			letter-spacing: .3px;
		}
		.subtitle {
			font-size: max(var(--min-text), calc(min(5dvw, 5dvh) * var(--font-scale)));
		}
		.day_count {
			font-size: max(var(--min-text), min(32dvh, 32dvw));
		}
		.label {
			letter-spacing: calc(.1 * min(8dvh, 8dvw) * var(--font-scale));
			text-transform: uppercase;
			font-size: max(var(--min-text), calc(min(8dvh, 8dvw) * var(--font-scale)))
		}
	</style>
{% endblock %}
{% block content %}
<div class="countdown">
	<div class="countdown-wrapper">
		<h1 class="title text-primary">{{settings.title}}</h1>
		<p class="subtitle text-secondary-1">{{date}}</p>
		<div class="day_count text-primary">{{day_count}}</div>
		<div class="label text-secondary-2">{{label}}</div>
	</div>
</div>
{% endblock %}
