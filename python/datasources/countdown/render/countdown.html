{% extends "plugin.html" %}

{% block style %}
	<style>
		.countdown-container {
			flex-grow: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: "Jost";
			height: 100%;
			width: 100%;
		}
		.countdown-wrapper {
			width: 90%;
			text-align: center;
			margin: 0;
			padding: 0;
		}
		.title {
			font-size: min(11dvw, 11dvh);
			font-weight: bold;
			letter-spacing: .3px;
		}
		.subtitle {
			font-size: min(5dvw, 5dvh);
		}
		.day_count {
			font-size: min(32dvh, 32dvw);
		}
		.label {
			letter-spacing: .1em;
			text-transform: uppercase;
			font-size: min(8dvh, 8dvw)
		}
	</style>
{% endblock %}
{% block content %}
<div class="countdown-container">
	<div class="countdown-wrapper">
		<h1 class="title text-primary">{{settings.title}}</h1>
		<p class="subtitle text-secondary-1">{{date}}</p>
		<div class="day_count text-primary">{{day_count}}</div>
		<div class="label text-secondary-2">{{label}}</div>
	</div>
</div>
{% endblock %}
