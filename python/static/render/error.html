{% extends "plugin.html" %}

{% block style %}
	<style>
		.error-container {
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: "Jost";
			height: 100%;
			width: 100%;
		}
		.error-wrapper {
			width: 90%;
			text-align: center;
		}
		.error-heading {
			font-size: min(7dvh, 6vw);
			font-weight: bold;
			letter-spacing: 0.1em;
			margin-bottom: 4dvh;
			line-height: 1;
		}
		.error-title {
			font-size: min(12dvh, 9vw);
			font-weight: bold;
			line-height: 1.1;
			margin-bottom: 4dvh;
			overflow-wrap: anywhere;
		}
		.error-line {
			font-size: min(6dvh, 5vw);
			line-height: 1.3;
			overflow-wrap: anywhere;
		}
		.error-hint {
			font-size: min(4dvh, 3.5vw);
			margin-top: 6dvh;
			line-height: 1;
		}
		/* an overlay zone: a short box, so bigger type relative to it, one line each, nothing wraps, the hint is left out */
		.error-compact .error-wrapper {
			width: 94%;
			max-height: 94dvh;
			overflow: hidden;
		}
		.error-compact .error-heading {
			font-size: 18dvh;
			letter-spacing: 0.04em;
			margin-bottom: 4dvh;
		}
		.error-compact .error-title {
			font-size: 30dvh;
			margin-bottom: 2dvh;
		}
		.error-compact .error-heading,
		.error-compact .error-title,
		.error-compact .error-line {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.error-compact .error-line {
			font-size: 20dvh;
		}
		.error-compact .error-hint {
			display: none;
		}
	</style>
{% endblock %}

{% block content %}
<div class="error-container{% if compact %} error-compact{% endif %}">
	<div class="error-wrapper">
		<div class="error-heading text-secondary-1">CANNOT SHOW THIS</div>
		<div class="error-title text-primary">{{ title }}</div>
		{% for line in lines %}
		<div class="error-line text-secondary-2">{{ line }}</div>
		{% endfor %}
		<div class="error-hint text-primary">Check the settings in the web app</div>
	</div>
</div>
{% endblock %}
