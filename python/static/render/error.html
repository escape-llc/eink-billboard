{% extends "plugin.html" %}

{% block style %}
	<style>
		.error-container {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100%;
			width: 100%;
		}
		.error-wrapper {
			width: 90%;
			text-align: center;
		}
		.error-logo {
			display: block;
			height: 20dvh;
			width: auto;
			margin: 0 auto 3dvh;
		}
		.error-heading {
			font-family: var(--font-heading);
			font-size: max(var(--min-text), min(7dvh, 6vw));
			font-weight: bold;
			letter-spacing: calc(.1 * min(7dvh, 6vw));
			margin-bottom: 4dvh;
			line-height: 1;
		}
		.error-title {
			font-family: var(--font-heading);
			font-size: max(var(--min-text), min(12dvh, 9vw));
			font-weight: bold;
			line-height: 1.1;
			margin-bottom: 4dvh;
			overflow-wrap: anywhere;
		}
		/* the setup page: the text on the left, the code that opens the web app with the setup code in it on the right, as big as the panel allows */
		.error-with-qr .error-wrapper {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 4vw;
			text-align: left;
		}
		.error-with-qr .error-text {
			flex: 1 1 0;
			min-width: 0;
		}
		.error-with-qr .error-logo {
			margin-left: 0;
		}
		.error-qr {
			flex: 0 0 auto;
			image-rendering: pixelated;
		}
		.error-line {
			font-size: max(var(--min-text), min(6dvh, 5vw));
			line-height: 1.3;
			overflow-wrap: anywhere;
		}
		.error-hint {
			font-size: max(var(--min-text), min(4dvh, 3.5vw));
			margin-top: 6dvh;
			line-height: 1;
		}
		/* an overlay zone: a short box, so bigger type relative to it, one line each, nothing wraps, the hint is left out */
		.error-compact .error-wrapper {
			width: 94%;
			max-height: 94dvh;
			overflow: hidden;
		}
		.error-compact .error-heading {
			font-size: max(var(--min-text), 18dvh);
			letter-spacing: .72dvh;
			margin-bottom: 4dvh;
		}
		.error-compact .error-title {
			font-size: max(var(--min-text), 30dvh);
			margin-bottom: 2dvh;
		}
		.error-compact .error-heading,
		.error-compact .error-title,
		.error-compact .error-line {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.error-compact .error-line {
			font-size: max(var(--min-text), 20dvh);
		}
		.error-compact .error-hint {
			display: none;
		}
	</style>
{% endblock %}

{% block content %}
<div class="error-container{% if compact %} error-compact{% endif %}{% if qr %} error-with-qr{% endif %}">
	<div class="error-wrapper">
		<div class="error-text">
		{% if logo and not compact %}<img class="error-logo" src="{{ logo }}" alt="">{% endif %}
		<div class="error-heading text-secondary-1">{{ heading }}</div>
		<div class="error-title text-primary">{{ title }}</div>
		{% for line in lines %}
		<div class="error-line text-secondary-2">{{ line }}</div>
		{% endfor %}
		{% if hint %}<div class="error-hint text-primary">{{ hint }}</div>{% endif %}
		</div>
		{% if qr %}<img class="error-qr" src="{{ qr }}" alt="">{% endif %}
	</div>
</div>
{% endblock %}
