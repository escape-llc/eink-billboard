<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
	Text for the panel: no antialiasing, no subpixel colour, full hinting. Chromium on Linux takes its text rendering from fontconfig (CSS cannot turn it off), and a panel has a few solid
	inks: a grey or a coloured fringe on a letter is dithered into dots. The renderer starts with FONTCONFIG_FILE pointing here (utils/image_utils.py); nothing else is affected.
-->
<fontconfig>
	<include ignore_missing="yes">/etc/fonts/fonts.conf</include>
	<match target="font">
		<edit name="antialias" mode="assign"><bool>false</bool></edit>
		<edit name="rgba" mode="assign"><const>none</const></edit>
		<edit name="hinting" mode="assign"><bool>true</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
	</match>
</fontconfig>
