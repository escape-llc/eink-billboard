{% extends "plugin.html" %}
{# A block of text for an overlay zone, with an optional drawing before it, on a transparent page (python/datasources/overlay_text.py chooses the size and the places) #}
{% block style %}
	<style>
		/* nothing behind the text: the picture under the overlay shows through */
		:root {
			--page-bg: transparent;
		}
		html {
			font-size: {{ font_px }}px;
		}
		.overlay-text {
			display: block;
			width: 100%;
			height: 100%;
		}
		.overlay-text text {
			font-family: var(--font-overlay);
			font-size: 1rem;
			font-weight: {{ font_weight }};
			/* the width was measured on the font's own face: Chromium must not make a bold of its own */
			font-synthesis: none;
			white-space: pre;
		}
		/* the outline: the text again under the letters, stroked in the theme's outline color */
		.overlay-text .outline {
			fill: currentColor;
			stroke: currentColor;
			stroke-width: {{ outline_px }}px;
			stroke-linejoin: round;
		}
		.overlay-text tspan {
			fill: currentColor;
		}
		{% if heavy_px > 0 %}
		/* heavy: each letter stroked in its own color, bolder than the font has it */
		.overlay-text .letters tspan {
			stroke: currentColor;
			stroke-width: {{ heavy_px }}px;
			stroke-linejoin: round;
		}
		{% endif %}
		/* a line drawing (a weather icon): strokes only, the outline under the line */
		.overlay-icon {
			/* fontconfig turns the antialiasing of text off; a shape's edge is not text, and would have partial alpha that the panel's quantizer dithers */
			shape-rendering: crispEdges;
			fill: none;
			stroke: currentColor;
			stroke-linecap: round;
			stroke-linejoin: round;
		}
	</style>
{% endblock %}
{% block content %}
	<svg class="overlay-text" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{ width }} {{ height }}">
		{% if icon %}
		<g transform="translate({{ icon.x }} {{ icon.y }}) scale({{ icon.scale }})">
			{% if icon.outline %}<g class="overlay-icon text-outline" stroke-width="{{ icon.outline }}">{{ icon.body | safe }}</g>{% endif %}
			<g class="overlay-icon {{ icon.role }}" stroke-width="{{ icon.weight }}">{{ icon.body | safe }}</g>
		</g>
		{% endif %}
		{% if outline_px > 0 %}{% for line in lines %}<text class="outline text-outline" x="{{ line.x }}" y="{{ line.baseline }}">{{ line.text }}</text>{% endfor %}{% endif %}
		{% for line in lines %}<text class="letters" x="{{ line.x }}" y="{{ line.baseline }}">{% for text, role in line.runs %}<tspan class="{{ role }}">{{ text }}</tspan>{% endfor %}</text>{% endfor %}
	</svg>
{% endblock %}
