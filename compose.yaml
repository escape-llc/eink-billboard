# Local container infrastructure (Podman or Docker).
#   podman compose run --rm test        # ruff + mypy + unit tests on Linux, as CI does
#   podman compose up --build app       # the server with the web app on http://localhost:8080
#   EINK_STORAGE=./.storage podman compose up --build app   # the same, on a storage folder of this checkout instead of the volume
# `test` needs nothing restored: the tests build their own storage (see AGENTS.md "Test environment").
services:
  test:
    profiles: ["test"]
    build: { context: ., target: test }
    volumes:
      - .:/work
      # keep Windows-side artifacts out of the container
      - /work/.venv
      - /work/app/node_modules
  app:
    build: { context: ., target: app }
    ports:
      - "127.0.0.1:8080:8080"   # localhost only; widen deliberately, and set a token if you do
    environment:
      EINK_API_TOKEN: ${EINK_API_TOKEN:-}
      # the address the setup page and the log tell you to open: inside the container the server only knows its network address, which the host cannot reach
      EINK_PUBLIC_URL: ${EINK_PUBLIC_URL:-http://localhost:8080}
      # a folder of a Windows host sends no change events into the container, so look for them (seconds; empty for events only)
      EINK_WATCH_POLL: ${EINK_WATCH_POLL:-2}
    volumes:
      # a name is the named volume below (seeded on the first start); a path (./.storage) is that folder of the host, used as it is
      - ${EINK_STORAGE:-storage}:/data
  # The same server with the Inky driver installed, to see what a device without its panel does (#281): `podman compose --profile inky up --build -d app-inky`, on
  # http://localhost:8081 with a storage of its own. Choose the `inky` Display Type in the Display settings, save, and restart it (`podman compose --profile inky restart app-inky`):
  # the driver loads, finds no board (there is no I2C here) and the status button says why. `EINK_FAKE_INKY=ok` (or busy-stuck, spi-off, unknown-board) pretends there is one.
  # No hardware is passed in on purpose.
  app-inky:
    profiles: ["inky"]
    build: { context: ., target: app-device }
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # what the pretend board does (scripts/fake_inky.py): ok | busy-stuck | spi-off | unknown-board; empty: no board at all (the real driver finds none)
      EINK_FAKE_INKY: ${EINK_FAKE_INKY:-}
      EINK_API_TOKEN: ${EINK_API_TOKEN:-}
      EINK_PUBLIC_URL: ${EINK_INKY_PUBLIC_URL:-http://localhost:8081}
      EINK_WATCH_POLL: ${EINK_WATCH_POLL:-2}
    volumes:
      - storage-inky:/data
  # The same for a Waveshare panel: `podman compose --profile waveshare up --build -d app-waveshare` on http://localhost:8082, own storage. Choose the `waveshare` Display Type and a
  # Waveshare Model, save, restart. `EINK_FAKE_WAVESHARE=ok|busy-stuck|spi-off` pretends there is a Raspberry Pi with a panel (scripts/fake_waveshare.py); empty: the driver finds no Pi.
  app-waveshare:
    profiles: ["waveshare"]
    build: { context: ., target: app-device }
    command: ["uv", "run", "--no-sync", "python", "-m", "scripts.fake_waveshare", "--host", "0.0.0.0", "--port", "8080", "--storage", "/data", "--app", "/work/app/dist"]
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      EINK_FAKE_WAVESHARE: ${EINK_FAKE_WAVESHARE:-}
      EINK_API_TOKEN: ${EINK_API_TOKEN:-}
      EINK_PUBLIC_URL: ${EINK_WAVESHARE_PUBLIC_URL:-http://localhost:8082}
      EINK_WATCH_POLL: ${EINK_WATCH_POLL:-2}
    volumes:
      - storage-waveshare:/data
volumes:
  storage:
  storage-inky:
  storage-waveshare:
